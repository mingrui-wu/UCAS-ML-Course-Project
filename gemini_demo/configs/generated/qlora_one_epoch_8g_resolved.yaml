video_max_pixels: 16384
video_fps: 0.5
video_maxlen: 2
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 4
lora_alpha: 8
lora_target: q_proj,v_proj
freeze_vision_tower: true
